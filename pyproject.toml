[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cub"
version = "0.1.0"
description = "Typed bitvector DSL that compiles to CNF"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pyrefly>=1.4.1",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
